[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "inspect-cot-audit"
version = "0.1.0"
description = "Lightweight extension library for Inspect AI to evaluate Chain of Thought (CoT) faithfulness, consistency, and deception."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["inspect-ai", "evals", "chain-of-thought", "cot", "llm-safety", "alignment"]
authors = [
    { name = "Your Name", email = "author@example.com" }
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "inspect-ai>=0.3.0",
    "pydantic>=2.0.0",
    "pandas>=3.0.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0.0",
    "pytest-asyncio>=0.23.0",
    "mypy>=1.8.0",
    "ruff>=0.3.0",
    "pandas>=2.0.0",
    "pandas-stubs>=2.0.0",
    "instructor",
    "openai",
]

[tool.hatch.build.targets.wheel]
packages = ["src/inspect_cot_audit"]

[tool.ruff]
target-version = "py310"
line-length = 100
src = ["src", "tests"]

[tool.ruff.lint]
select = [
    "E",   # pycodestyle errors
    "W",   # pycodestyle warnings
    "F",   # Pyflakes
    "I",   # isort
    "B",   # flake8-bugbear
    "C4",  # flake8-comprehensions
    "UP",  # pyupgrade
    "RUF", # Ruff-specific rules
]
ignore = []

[tool.ruff.lint.isort]
known-first-party = ["inspect_cot_audit"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true
disallow_untyped_defs = true
disallow_incomplete_defs = true
check_untyped_defs = true
disallow_untyped_decorators = true
no_implicit_optional = true
warn_redundant_casts = true
warn_unused_ignores = true
show_error_codes = true
mypy_path = ["src"]
explicit_package_bases = true

[[tool.mypy.overrides]]
module = [
    "inspect_ai.*",
]
ignore_missing_imports = true

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-ra -q --import-mode=importlib"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
